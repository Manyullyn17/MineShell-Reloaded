# What can break without a commit, part two (the APIs are nightly.yml): a real install with a
# real server on real systemd per Ubuntu version (ubuntu-latest moves), and the test suite in
# shuffled orders. scripts/release.sh refuses to release while the last run failed. GitHub
# pauses schedules after 60 days without activity in the repository.
name: Weekly

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

jobs:
  install:
    name: Install and a real server, Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build the release archive
        run: |
          npm ci
          npm run build
          scripts/package.sh

      # A runner's account has no login session, so no user manager until lingering starts one.
      - name: The account's systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for _ in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && exit 0; sleep 1; done
          echo "No user manager for $USER." >&2
          exit 1

      # Ubuntu 24.04 and 26.04 refuse systemd's user manager the user namespaces the servers'
      # sandbox needs. The fix as DEPLOYMENT.md gives it for each, run from the doc itself so the
      # two cannot drift: 24.04's per-account drop-in, 26.04's profile attached by path (there
      # the drop-in only stacks).
      - name: AppArmor exception from DEPLOYMENT.md
        if: matrix.ubuntu != '22.04'
        env:
          BLOCK: ${{ matrix.ubuntu == '24.04' && 'AppArmorProfile=-systemd-userns' || 'profile systemd-userns /usr/lib/systemd/systemd' }}
        run: |
          awk -v want="$BLOCK" '/^```sh$/ { block = ""; inside = 1; next } /^```$/ { if (inside && index(block, want)) { printf "%s", block; exit } inside = 0; next } inside { block = block $0 "\n" }' docs/DEPLOYMENT.md > "$RUNNER_TEMP/apparmor.sh"
          cat "$RUNNER_TEMP/apparmor.sh"
          grep -q apparmor_parser "$RUNNER_TEMP/apparmor.sh"
          bash -e "$RUNNER_TEMP/apparmor.sh"
          sudo systemctl restart "user@$(id -u)"
          for _ in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Install
        run: MINESHELL_ARCHIVE="$(ls dist/mineshell-*.tar.gz)" scripts/install.sh

      - name: First visit
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/setup)" = 200

      # A real server, driven through its form actions without signing in.
      - name: A real server
        run: |
          sed -i 's/^MINESHELL_AUTH=.*/MINESHELL_AUTH=off/' ~/.config/mineshell/mineshell.env
          systemctl --user restart mineshell
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          U=http://127.0.0.1:3000 PREFIX=mineshell DATA=~/.local/share/mineshell APP=~/mineshell/current tests/tools/real-server.sh

      # After the server, so the Java it downloaded is there; the sandbox has to apply on both
      # (22.04's systemd 249 makes the user namespace only when PrivateUsers= asks for it).
      - name: Doctor
        run: |
          cd ~/mineshell/current
          MINESHELL_ENV_FILE=~/.config/mineshell/mineshell.env node scripts/doctor.mjs | tee "$RUNNER_TEMP/doctor.txt"
          grep -q '^ ok   systemd can sandbox servers' "$RUNNER_TEMP/doctor.txt"

      - name: MineShell's log
        if: failure()
        run: journalctl --user -u mineshell -n 200 --no-pager

  repeat:
    name: Tests in shuffled orders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: 20 runs
        run: tests/tools/repeat-tests.sh 20
